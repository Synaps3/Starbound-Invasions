name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    name: Validate syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Validate Lua syntax
        run: |
          set -e
          found=0
          while IFS= read -r -d '' file; do
            found=1
            echo "luac -p $file"
            luac5.3 -p "$file"
          done < <(find . -path ./.git -prune -o -name '*.lua' -print0)
          if [ "$found" -eq 0 ]; then
            echo "No Lua files found."
          fi

      - name: Validate JSON syntax
        run: |
          python3 .github/scripts/validate_json.py
